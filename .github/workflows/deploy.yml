name: Deploy

on:
  push:
    branches: [main]

# Allow the workflow's GITHUB_TOKEN to create GitHub Deployment objects
# (these are what populate the repo's "Deployments" panel).
permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Start GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              production_environment: true,
              required_contexts: [],
              auto_merge: false,
              description: 'Deploy to Hetzner',
            });
            core.setOutput('id', deployment.data.id);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'in_progress',
              description: 'Deploying to Hetzner…',
            });

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799  # v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Migrations run as their own step, against the freshly built image, BEFORE the
          # running containers are replaced. If one fails, the step exits non-zero, the old
          # backend keeps serving (drizzle applies all pending migrations in one
          # transaction, so the schema is unchanged), and the error is in this log. The
          # backend also migrates on boot (a no-op by then) so it can never listen
          # against an older schema.
          script: |
            set -e
            cd ~/bibliotab
            git pull
            compose="docker compose -f docker-compose.prod.yml"
            $compose build
            echo "::group::Database migrations"
            $compose run --rm backend node dist/server/src/data/migrate.js
            echo "::endgroup::"
            $compose up -d
            # `up -d` returns as soon as containers are created, even if the backend then
            # crash-loops. Wait for it to report that it is listening.
            for i in $(seq 1 30); do
              if $compose logs backend 2>&1 | grep -q "Application running"; then
                echo "Backend is up."
                exit 0
              fi
              sleep 2
            done
            echo "Backend did not start within 60s. Recent logs:"
            $compose logs --tail 100 backend
            exit 1

      - name: Finish GitHub deployment
        if: always()
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure';
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              environment_url: 'https://bibliotab.com',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: state === 'success' ? 'Deployed to Hetzner' : 'Deploy failed',
            });
